[package]
name = "jsrt"
version = "0.1.0"
edition = "2024"

[features]
default = ["dep:v8"]
quickjs = ["dep:rquickjs"]

[[example]]
name = "hello"
path = "examples/hello.rs"

[[example]]
name = "eval"
path = "examples/eval.rs"

[[example]]
name = "cycle"
path = "examples/cycle.rs"

[[example]]
name = "stage1"
path = "examples/stage1.rs"

[dependencies]
num-bigint = "=0.5.1"
oxc = { version = "=0.156.0", features = ["ast_visit"] }
serde_json = "=1.0.154"

[target.'cfg(not(any(target_os = "macos", target_os = "ios", target_os = "android", all(target_os = "windows", target_env = "gnu"))))'.dependencies]
v8 = { version = "152.2.0", optional = true }

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
rquickjs = { version = "=0.14.0", optional = true }

[build-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
