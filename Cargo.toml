[package]
name = "jsrt"
version = "0.1.0"
edition = "2024"

[[example]]
name = "hello"
path = "examples/hello.rs"

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
num-bigint = "=0.5.1"
oxc = "=0.156.0"
serde_json = "=1.0.154"
v8 = "152.2.0"

[build-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
